<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Weekly Summary · Preview</title>
    <link rel="stylesheet" href="weekly-summary.css" />
    <style>
      :root {
        --gold: #ffca28;
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 15% 10%, #123455 0, transparent 34%),
          radial-gradient(circle at 88% 80%, #35270b 0, transparent 30%),
          #050b12;
        color: #f4f8fc;
      }
      .preview-shell {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .preview-copy {
        max-width: 520px;
        padding: 28px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        background: rgba(8, 18, 28, 0.82);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
      }
      .preview-copy span {
        color: var(--gold);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.16em;
      }
      .preview-copy h1 {
        margin: 8px 0;
        font-size: 30px;
        letter-spacing: -0.04em;
      }
      .preview-copy p {
        margin: 0;
        color: #9eb0c0;
        font-size: 13px;
        line-height: 1.6;
      }
      .preview-copy button {
        margin-top: 18px;
        padding: 12px 18px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, #ffb800, #ffe064);
        color: #171006;
        font-weight: 900;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="preview-shell">
      <section class="preview-copy">
        <span>PREVIEWDATA · INGEN DATA LAGRES</span>
        <h1>Weekly Summary</h1>
        <p>
          Dette er en interaktiv UI-demo med representative seks-spillersdata.
          Lukk rapporten for å se denne informasjonen.
        </p>
        <button type="button" onclick="location.reload()">
          ÅPNE RAPPORTEN IGJEN
        </button>
      </section>
    </main>

    <script src="pokemon-data.js"></script>
    <script>
      (() => {
        const names = ["Test", "Adrian", "Rikard", "Joachim", "Mina", "Ola"];
        const catches = [149, 25, 4, 6, 150, 9];
        const players = names.map((name, index) => ({
          id: `preview-${index + 1}`,
          name,
          character_set: (index % 3) + 1,
          training_days: Math.max(0, 6 - index),
          workouts: Math.max(0, 7 - index),
          strength: Math.max(0, 4 - index),
          cardio: Math.max(0, 3 - index),
          xp_delta: index === 5 ? -6 : 14 - index,
          streak: Math.max(0, 8 - index),
          previous_streak: Math.max(0, 7 - index),
          streak_status: index === 5 ? "broken" : "continued",
          wild: {
            total: index === 0 ? 6 : Math.max(0, 4 - index),
            normal: index === 0 ? 1 : Math.max(0, 2 - index),
            strong: index === 0 ? 3 : Math.max(0, 2 - index),
            elite: index === 0 ? 2 : 0,
            catches:
              index === 0
                ? catches.map((pokemon_id) => ({
                    pokemon_id,
                    rarity: [149, 150].includes(pokemon_id)
                      ? "elite"
                      : [25, 6, 9].includes(pokemon_id)
                        ? "strong"
                        : "normal",
                  }))
                : [1, 3, 7, 9]
                    .slice(0, Math.max(0, 4 - index))
                    .map((pokemon_id) => ({
                      pokemon_id,
                      rarity: [3, 9].includes(pokemon_id) ? "strong" : "normal",
                    })),
          },
          gym: {
            damage: 12450 - index * 1450,
            boss_ko: index < 2 ? 1 : 0,
            stolen:
              index === 0
                ? [
                    { pokemon_id: 150, method: "snipe" },
                    { pokemon_id: 25, method: "random_shuffle" },
                  ]
                : [],
            snipe: index === 0 ? 1 : 0,
            random_shuffle: index === 0 ? 1 : 0,
          },
          history: {
            all_time: { strength: 42 - index * 3, cardio: 31 - index * 2 },
            last_4_weeks: { strength: 10 - index, cardio: 8 - index },
            last_8_weeks: { strength: 20 - index, cardio: 15 - index },
            average_8_weeks: {
              strength: Number((2.5 - index * 0.1).toFixed(1)),
              cardio: Number((1.9 - index * 0.1).toFixed(1)),
            },
          },
        }));
        const summary = {
          schema_version: 1,
          viewer_player_id: players[0].id,
          week: { start: "2026-08-03", end: "2026-08-09" },
          coverage: {
            gameplay_events_complete: true,
            gameplay_events_started_on: "2026-08-16",
          },
          motivation: {
            tone: "elite",
            eyebrow: "WEEK SECURED",
            headline: "Monsteruke, Test!",
            text: "6 treningsdager og 7 økter. Fin balanse mellom styrke og kondisjon. 8 ukers streak lever videre · 2 Elite-fangster.",
            next_goal: "Neste mål: 7 treningsdager",
          },
          training_ranking: players.map((player, index) => ({
            id: player.id,
            rank: index + 1,
          })),
          wild_ranking: players.map((player, index) => ({
            id: player.id,
            rank: index + 1,
          })),
          players,
        };

        window.obdAuthReady = true;
        window.getSelectedPlayerId = () => players[0].id;
        window.getBattlePlayers = () => players;
        const realFetch = window.fetch.bind(window);
        window.fetch = async (url, options = {}) => {
          if (!String(url).includes("/weekly-summary"))
            return realFetch(url, options);
          const payload = JSON.parse(options.body || "{}");
          const response =
            payload.action === "dismiss"
              ? { ok: true, debug: true }
              : { show: true, debug: true, summary };
          return { ok: true, text: async () => JSON.stringify(response) };
        };
      })();
    </script>
    <script src="weekly-summary.js"></script>
  </body>
</html>
