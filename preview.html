<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Operation Big Dawg · Preview</title>
  <style>
    html,body{margin:0;min-height:100%;background:#050b12;color:#fff;font-family:system-ui,sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    .loading strong{display:block;font-size:18px}.loading small{display:block;margin-top:7px;color:#8fa4b7}
  </style>
</head>
<body>
  <div class="loading"><div><strong>Laster preview…</strong><small>Wild Pokémon battle + cooldown</small></div></div>
  <script>
    (async()=>{
      try{
        const response=await fetch('/index.html?preview-source=1',{cache:'no-store'});
        if(!response.ok)throw new Error('Kunne ikke laste index.html');
        let html=await response.text();
        const coreMarker='<script src="core.js"><\/script>';
        const authMarker='<script src="auth.js"><\/script>';
        if(!html.includes(coreMarker)||!html.includes(authMarker))throw new Error('Preview-hooks mangler i index.html');
        html=html.replace(coreMarker,'<script src="preview-bootstrap.js?v=5"><\/script>\n  '+coreMarker);
        html=html.replace(authMarker,authMarker+'\n  <script src="admin-v2-preview.js?v=1"><\/script>\n  <script src="wild-battle-preview.js?v=2"><\/script>\n  <script src="wild-battle-preview-ok-fix.js?v=2"><\/script>');
        // Load the Wild cooldown guard after every original app script so its
        // preview routing remains the outermost/authoritative fetch layer.
        html=html.replace('</body>','  <script src="wild-cooldown-preview.js?v=3"><\/script>\n</body>');
        document.open();document.write(html);document.close();
      }catch(error){
        document.body.innerHTML='<div class="loading"><div><strong>Preview kunne ikke startes</strong><small>'+String(error?.message||error)+'</small></div></div>';
      }
    })();
  </script>
</body>
</html>
